<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex, nofollow">
<title>MAACAT — Staff</title>
<link rel="icon" href="assets/branding/maacat-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/backend.js"></script>
</head>
<body class="staff-body">

<div class="staff-top" id="staff-top">
  <div class="who">
    STALL <b id="stall-name">—</b>
  </div>
  <span id="stall-num" style="font-family:var(--display); font-size:2rem; color:var(--c);">--</span>
</div>

<main class="staff-main" id="staff-main">
  <!-- filled by JS: no-stall message, PIN pad, or grant screen -->
</main>

<script>
/* ============================================================
   Same STALLS colours as index.html. Keep names in sync if you
   rename a stall there.
   ============================================================ */
const STALLS = {
  "01":{name:"Marketing Ladder", color:"var(--green)"},
  "02":{name:"Cheap or Chic?",   color:"var(--turq)"},
  "03":{name:"Build-a-Brand",    color:"var(--purple)"},
  "04":{name:"Maacat Snap Lab",  color:"var(--yellow)"},
  "05":{name:"PR Disaster",      color:"var(--pink)"},
  "06":{name:"Brand Relay",      color:"var(--orange)"}
};

/* PINs and stamp storage now live in assets/js/backend.js
   (MaacatBackend), shared with index.html. */

const stallId = new URLSearchParams(location.search).get('stall');
const stall = STALLS[stallId];
const main = document.getElementById('staff-main');
const topBar = document.getElementById('staff-top');

if(!stall){
  topBar.style.display = 'none';
  main.innerHTML = `
    <h2 style="font-family:var(--display); text-transform:uppercase; font-size:1.8rem;">No stall selected</h2>
    <p style="color:var(--grey); margin-top:10px;">
      Open this page with a stall number, e.g.<br><code>staff.html?stall=03</code>
    </p>`;
} else {
  document.documentElement.style.setProperty('--c', stall.color);
  document.getElementById('stall-name').textContent = stall.name;
  document.getElementById('stall-num').textContent = stallId;
  document.title = `MAACAT Staff — Stall ${stallId}`;

  const sessionKey = `maacat_staff_unlocked_${stallId}`;
  window.sessionKey = sessionKey;
  if(sessionStorage.getItem(sessionKey) === '1') renderGrant();
  else renderPin();
}

/* ---------------- PIN screen ---------------- */
function renderPin(){
  let entered = '';
  main.innerHTML = `
    <div class="pin-screen">
    <p style="text-align:center; color:var(--grey-dim); font-size:.8rem; font-weight:700; letter-spacing:.1em; margin-bottom:18px;">ENTER STALL PIN</p>
    <div class="pin-dots" id="pd"></div>
    <p class="pin-err" id="pin-err"></p>
    <div class="pin-pad" id="pad"></div>
    </div>
  `;
  const dots = document.getElementById('pd');
  const err = document.getElementById('pin-err');
  const pad = document.getElementById('pad');

  function draw(){
    dots.innerHTML = Array.from({length:4}, (_,i) =>
      `<b class="${i < entered.length ? 'filled':''}"></b>`).join('');
  }
  draw();

  const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
  pad.innerHTML = keys.map(k => `<button type="button" data-k="${k}">${k}</button>`).join('');

  pad.addEventListener('click', async e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const k = btn.dataset.k;
    if(k === '⌫'){ entered = entered.slice(0,-1); err.textContent=''; draw(); return; }
    if(k === 'OK'){
      const attempt = entered;
      entered = '';
      draw();
      err.textContent = 'Checking…';
      const ok = await MaacatBackend.verifyPin(stallId, attempt);
      if(ok){
        sessionStorage.setItem(window.sessionKey, '1');
        renderGrant();
        return;
      }
      err.textContent = 'Wrong PIN. Try again.';
      return;
    }
    if(entered.length < 4){ entered += k; err.textContent = ''; }
    draw();
  });
}

/* ---------------- Grant screen ---------------- */
function cleanPhone(v){ return v.replace(/\D/g,''); }

function renderGrant(){
  const modeNote = MaacatBackend.mode === 'live'
    ? `Live mode: this device is talking to the shared database — every stall sees these stamps.`
    : `Prototype mode: stamps are stored in this browser only, so this device won't see stamps
       granted at other stalls' devices. Fill in assets/js/backend.js (see BACKEND.md → "Fastest
       path: Supabase") so every stall reads and writes the same shared record.`;

  main.innerHTML = `
    <label for="phone" style="font-family:var(--display); text-transform:uppercase; font-size:1rem; display:block; margin-bottom:8px;">
      Participant's mobile number
    </label>
    <input class="grant-phone" id="phone" type="tel" inputmode="numeric" placeholder="7XXXXXX" maxlength="15" autocomplete="off">
    <button class="btn grant-btn" id="grant" type="button">Grant Stamp</button>
    <div class="grant-msg" id="msg"></div>

    <div class="grant-log">
      <h4>Recent at this stall</h4>
      <ul id="log"><li style="color:var(--grey-dim);">No grants yet this session.</li></ul>
    </div>

    <p class="proto-note" style="margin-top:30px;">${modeNote}</p>
  `;

  const phoneEl = document.getElementById('phone');
  const grantBtn = document.getElementById('grant');
  const msg = document.getElementById('msg');
  const log = document.getElementById('log');
  const grants = [];
  phoneEl.focus();

  function renderLog(){
    if(!grants.length) return;
    log.innerHTML = grants.slice(0,8).map(g =>
      `<li><span>${g.phone}</span><span>${g.time}</span></li>`).join('');
  }

  async function doGrant(){
    const phone = cleanPhone(phoneEl.value);
    msg.className = 'grant-msg';
    if(phone.length < 7){
      msg.textContent = 'Enter a valid mobile number first.';
      msg.classList.add('show','dupe');
      return;
    }

    grantBtn.disabled = true;
    grantBtn.textContent = 'Checking…';
    const res = await MaacatBackend.grantStamp(stallId, phone);
    grantBtn.disabled = false;
    grantBtn.textContent = 'Grant Stamp';

    if(!res.success){
      msg.textContent = res.message || 'Could not grant a stamp.';
      msg.className = 'grant-msg show dupe';
    } else {
      msg.textContent = res.full_card
        ? '✓ Stamped — full card! Eligible for the grand draw.'
        : `✓ Stamped — ${res.stamp_count} of 6 stalls collected.`;
      msg.className = 'grant-msg show ok';
      grants.unshift({ phone, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) });
      renderLog();
    }
    phoneEl.value = '';
    phoneEl.focus();
  }

  grantBtn.addEventListener('click', doGrant);
  phoneEl.addEventListener('keydown', e => { if(e.key === 'Enter') doGrant(); });
}
</script>

</body>
</html>
